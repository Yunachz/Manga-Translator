<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" width="1100" height="810" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Manga Translator architecture</title>
  <desc id="d">A click on the reader page goes to the service worker. The offscreen inference worker reads the panel with local OCR. The service worker translates the text with Chrome Translator in the offscreen document or an optional cloud provider that receives OCR text and enabled context. The worker then cleans and typesets a patch that the content script overlays on the page. IndexedDB keeps image crops and results locally.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6ea8fe"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0a93b"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa7b6"/></marker>
  </defs>

  <rect width="1100" height="810" rx="16" fill="#12151a"/>
  <text x="40" y="54" font-size="28" font-weight="700" fill="#f1f4f8">Manga Translator architecture</text>
  <text x="40" y="86" font-size="17" fill="#b3bdca">Image processing stays in the browser. Optional cloud providers translate text.</text>

  <!-- Browser boundary -->
  <rect x="24" y="110" width="790" height="600" rx="18" fill="#161a20" stroke="#4a586a" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="44" y="140" font-size="16" font-weight="600" fill="#b3bdca">Your Chromium browser</text>

  <!-- Cloud -->
  <text x="860" y="130" font-size="14" fill="#b3bdca">Outside the browser</text>
  <rect x="860" y="140" width="216" height="170" rx="14" fill="#2a2216" stroke="#e0a93b" stroke-width="1.5"/>
  <text x="878" y="172" font-size="18" font-weight="700" fill="#f6d58e">Cloud translators</text>
  <text x="878" y="194" font-size="15" fill="#d8c9a6">Optional, your own API key</text>
  <text x="878" y="224" font-size="15" fill="#f1f4f8">Gemini, OpenAI, DeepL</text>
  <text x="878" y="246" font-size="15" fill="#f1f4f8">Google Cloud, Azure</text>
  <text x="878" y="278" font-size="16" font-weight="700" fill="#f6d58e">Text only.</text>
  <text x="878" y="298" font-size="16" font-weight="700" fill="#f6d58e">Images stay local.</text>

  <!-- Reader page -->
  <rect x="44" y="250" width="200" height="340" rx="14" fill="#1c222b" stroke="#41505f" stroke-width="1.5"/>
  <text x="60" y="282" font-size="18" font-weight="700" fill="#f1f4f8">Reader page</text>
  <text x="60" y="304" font-size="15" fill="#b3bdca">Content script</text>
  <rect x="60" y="330" width="168" height="80" rx="10" fill="#262f3b" stroke="#50617a"/>
  <text x="76" y="364" font-size="16" fill="#f1f4f8">Click a panel or</text>
  <text x="76" y="386" font-size="16" fill="#f1f4f8">Select area</text>
  <rect x="60" y="436" width="168" height="80" rx="10" fill="#262f3b" stroke="#50617a"/>
  <text x="76" y="470" font-size="16" fill="#f1f4f8">Canvas patch</text>
  <text x="76" y="492" font-size="16" fill="#f1f4f8">overlay</text>

  <!-- Service worker -->
  <rect x="300" y="250" width="200" height="340" rx="14" fill="#1c222b" stroke="#41505f" stroke-width="1.5"/>
  <text x="316" y="282" font-size="18" font-weight="700" fill="#f1f4f8">Service worker</text>
  <text x="316" y="304" font-size="15" fill="#b3bdca">Manifest V3</text>
  <rect x="316" y="324" width="168" height="64" rx="10" fill="#262f3b" stroke="#50617a"/>
  <text x="332" y="352" font-size="16" fill="#f1f4f8">Job queue and</text>
  <text x="332" y="374" font-size="16" fill="#f1f4f8">orchestration</text>
  <rect x="316" y="404" width="168" height="64" rx="10" fill="#262f3b" stroke="#50617a"/>
  <text x="332" y="432" font-size="16" fill="#f1f4f8">API keys and</text>
  <text x="332" y="454" font-size="16" fill="#f1f4f8">permissions</text>
  <rect x="316" y="484" width="168" height="64" rx="10" fill="#262f3b" stroke="#50617a"/>
  <text x="332" y="512" font-size="16" fill="#f1f4f8">Image retrieval or</text>
  <text x="332" y="534" font-size="16" fill="#f1f4f8">tab capture</text>

  <!-- Offscreen document -->
  <rect x="560" y="250" width="234" height="340" rx="14" fill="#1c222b" stroke="#41505f" stroke-width="1.5"/>
  <text x="576" y="282" font-size="18" font-weight="700" fill="#f1f4f8">Offscreen document</text>
  <text x="576" y="304" font-size="15" fill="#b3bdca">Local processing</text>
  <rect x="576" y="316" width="202" height="196" rx="12" fill="#1f2b38" stroke="#4f6a88" stroke-width="1.5"/>
  <text x="592" y="340" font-size="16" font-weight="700" fill="#f1f4f8">Inference worker</text>
  <text x="592" y="359" font-size="14" fill="#b3bdca">WebGPU or WASM</text>
  <rect x="592" y="372" width="170" height="56" rx="10" fill="#2a3544" stroke="#5c7ba0"/>
  <text x="608" y="396" font-size="16" fill="#f1f4f8">Panel detection</text>
  <text x="608" y="416" font-size="16" fill="#f1f4f8">+ OCR text</text>
  <rect x="592" y="442" width="170" height="56" rx="10" fill="#2a3544" stroke="#5c7ba0"/>
  <text x="608" y="466" font-size="16" fill="#f1f4f8">Clean and typeset</text>
  <text x="608" y="486" font-size="16" fill="#f1f4f8">patch (PNG)</text>
  <rect x="576" y="524" width="202" height="52" rx="10" fill="#262f3b" stroke="#50617a"/>
  <text x="592" y="547" font-size="16" fill="#f1f4f8">Chrome Translator</text>
  <text x="592" y="567" font-size="14" fill="#b3bdca">runs locally</text>

  <!-- IndexedDB -->
  <rect x="300" y="632" width="494" height="58" rx="12" fill="#1c222b" stroke="#41505f" stroke-width="1.5"/>
  <text x="318" y="657" font-size="17" font-weight="700" fill="#f1f4f8">IndexedDB (local)</text>
  <text x="318" y="679" font-size="15" fill="#b3bdca">image crops, OCR text, translations, patches</text>
  <line x1="400" y1="592" x2="400" y2="630" stroke="#9aa7b6" stroke-width="2" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <line x1="676" y1="592" x2="676" y2="630" stroke="#9aa7b6" stroke-width="2" marker-start="url(#ag)" marker-end="url(#ag)"/>

  <!-- Page <-> service worker -->
  <line x1="246" y1="350" x2="298" y2="350" stroke="#6ea8fe" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="298" y1="520" x2="246" y2="520" stroke="#6ea8fe" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="272" cy="326" r="12" fill="#6ea8fe"/><text x="272" y="331" fill="#0d1117">1</text>
    <circle cx="272" cy="496" r="12" fill="#6ea8fe"/><text x="272" y="501" fill="#0d1117">5</text>
  </g>

  <!-- Service worker <-> offscreen -->
  <line x1="502" y1="390" x2="558" y2="390" stroke="#6ea8fe" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="558" y1="414" x2="502" y2="414" stroke="#6ea8fe" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <line x1="502" y1="458" x2="558" y2="458" stroke="#6ea8fe" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="558" y1="482" x2="502" y2="482" stroke="#6ea8fe" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <line x1="502" y1="540" x2="558" y2="540" stroke="#6ea8fe" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="558" y1="566" x2="502" y2="566" stroke="#6ea8fe" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="530" cy="367" r="12" fill="#6ea8fe"/><text x="530" y="372" fill="#0d1117">2</text>
    <circle cx="530" cy="435" r="12" fill="#6ea8fe"/><text x="530" y="440" fill="#0d1117">4</text>
    <circle cx="530" cy="517" r="12" fill="#6ea8fe"/><text x="530" y="522" fill="#0d1117">3</text>
  </g>

  <!-- Service worker <-> cloud: text only -->
  <polyline points="430,248 430,170 858,170" fill="none" stroke="#e0a93b" stroke-width="2.5" marker-end="url(#aa)"/>
  <polyline points="858,230 470,230 470,248" fill="none" stroke="#e0a93b" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aa)"/>
  <circle cx="470" cy="170" r="12" fill="#e0a93b"/><text x="470" y="175" font-size="14" font-weight="700" text-anchor="middle" fill="#0d1117">3</text>
  <text x="560" y="162" font-size="15" fill="#f6d58e">OCR text + optional context</text>
  <text x="560" y="222" font-size="15" fill="#f6d58e">translation</text>

  <!-- Order and key -->
  <g font-size="16" fill="#f1f4f8">
    <g font-size="14" font-weight="700" text-anchor="middle">
      <circle cx="52" cy="748" r="12" fill="#6ea8fe"/><text x="52" y="753" fill="#0d1117">1</text>
      <circle cx="262" cy="748" r="12" fill="#6ea8fe"/><text x="262" y="753" fill="#0d1117">2</text>
      <circle cx="502" cy="748" r="12" fill="#6ea8fe"/><text x="502" y="753" fill="#0d1117">3</text>
      <circle cx="692" cy="748" r="12" fill="#6ea8fe"/><text x="692" y="753" fill="#0d1117">4</text>
      <circle cx="938" cy="748" r="12" fill="#6ea8fe"/><text x="938" y="753" fill="#0d1117">5</text>
    </g>
    <text x="72" y="754">Select a panel</text>
    <text x="282" y="754">Read text (OCR)</text>
    <text x="522" y="754">Translate</text>
    <text x="712" y="754">Clean and typeset</text>
    <text x="958" y="754">Patch on page</text>
  </g>
  <text x="40" y="788" font-size="15" fill="#b3bdca">Solid = request · dashed = result · amber = cloud translation</text>
</svg>
