<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 112" width="820" height="112" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Manga Translator flow</title>
  <desc id="d">Left to right: Select panel in the reader tab, Load image in the service worker, Detect and OCR in the offscreen worker, Translate with Chrome or a cloud provider, Clean and typeset in the offscreen worker, then Show patch on the canvas overlay.</desc>
  <style>
    .box{fill:#fff;stroke:#1f2328;stroke-width:2}
    .line{stroke:#1f2328;stroke-width:2;fill:none}
    .head{fill:#1f2328;font-size:14px;font-weight:600;text-anchor:middle}
    .sub{fill:#57606a;font-size:12px;text-anchor:middle}
    .tip{fill:#1f2328}
    @media (prefers-color-scheme: dark){.box{fill:#0d1117;stroke:#f0f6fc}.line{stroke:#f0f6fc}.tip{fill:#f0f6fc}.head{fill:#f0f6fc}.sub{fill:#c9d1d9}}
  </style>
  <rect class="box" x="8" y="8" width="114" height="96"/>
  <text class="head" x="65.0" y="42">Select panel</text>
  <text class="sub" x="65.0" y="92">Reader tab</text>
  <line class="line" x1="122" y1="56.0" x2="139" y2="56.0"/>
  <path class="tip" d="M146 56.0L137 51.0V61.0z"/>
  <rect class="box" x="146" y="8" width="114" height="96"/>
  <text class="head" x="203.0" y="42">Load image</text>
  <text class="sub" x="203.0" y="78">MV3 service</text>
  <text class="sub" x="203.0" y="92">worker</text>
  <line class="line" x1="260" y1="56.0" x2="277" y2="56.0"/>
  <path class="tip" d="M284 56.0L275 51.0V61.0z"/>
  <rect class="box" x="284" y="8" width="114" height="96"/>
  <text class="head" x="341.0" y="38">Detect</text>
  <text class="head" x="341.0" y="55">and OCR</text>
  <text class="sub" x="341.0" y="78">Offscreen</text>
  <text class="sub" x="341.0" y="92">worker</text>
  <line class="line" x1="398" y1="56.0" x2="415" y2="56.0"/>
  <path class="tip" d="M422 56.0L413 51.0V61.0z"/>
  <rect class="box" x="422" y="8" width="114" height="96"/>
  <text class="head" x="479.0" y="42">Translate</text>
  <text class="sub" x="479.0" y="78">Chrome or</text>
  <text class="sub" x="479.0" y="92">cloud</text>
  <line class="line" x1="536" y1="56.0" x2="553" y2="56.0"/>
  <path class="tip" d="M560 56.0L551 51.0V61.0z"/>
  <rect class="box" x="560" y="8" width="114" height="96"/>
  <text class="head" x="617.0" y="38">Clean and</text>
  <text class="head" x="617.0" y="55">typeset</text>
  <text class="sub" x="617.0" y="78">Offscreen</text>
  <text class="sub" x="617.0" y="92">worker</text>
  <line class="line" x1="674" y1="56.0" x2="691" y2="56.0"/>
  <path class="tip" d="M698 56.0L689 51.0V61.0z"/>
  <rect class="box" x="698" y="8" width="114" height="96"/>
  <text class="head" x="755.0" y="42">Show patch</text>
